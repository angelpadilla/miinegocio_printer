name: "Multiplatform Release"

on:
  push:
    tags:
      - "v*" # Se activa al subir tags como v0.1.0, v1.0.0, etc.
  workflow_dispatch: # Permite ejecución manual desde la interfaz de GitHub

jobs:
  publish-tauri:
    permissions:
      contents: write # Permiso necesario para crear el Release y adjuntar ejecutables
    strategy:
      fail-fast: false
      matrix:
        include:
          - platform: "windows-latest"
            args: ""
          - platform: "ubuntu-22.04"
            args: ""
          - platform: "macos-latest"
            args: ""

    runs-on: ${{ matrix.platform }}

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      # --- Dependencias del sistema necesarias para Linux (Ubuntu) ---
      - name: Install dependencies (Ubuntu)
        if: matrix.platform == 'ubuntu-22.04'
        run: |
          sudo apt-get update
          sudo apt-get install -y \
            pkg-config \
            libudev-dev \
            libusb-1.0-0-dev \
            libgtk-3-dev \
            libwebkit2gtk-4.1-dev \
            libayatana-appindicator3-dev \
            librsvg2-dev \
            patchelf \
            xdg-utils

      # --- Configuración del entorno Bun ---
      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest

      # --- Instalación de Rust ---
      - name: Install Rust stable
        uses: dtolnay/rust-toolchain@stable

      # --- Caché de Rust (Acelera builds posteriores) ---
      - name: Rust cache
        uses: swatinem/rust-cache@v2
        with:
          workspaces: "./src-tauri -> target"

      # --- Instalación de dependencias del Frontend ---
      - name: Install frontend dependencies
        run: bun install --frozen-lockfile

      # --- Compilación de Tauri v2 y Creación del Release ---
      - name: Build Tauri App & Create Release
        uses: tauri-apps/tauri-action@v0
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        with:
          tagName: ${{ github.ref_name }}
          releaseName: "Miinegocio Printer v__VERSION__"
          releaseBody: "Descarga los instaladores y ejecutables de Miinegocio Printer para Windows, Linux y macOS."
          releaseDraft: true
          prerelease: false
          tauriScript: "bun run tauri"
          args: ${{ matrix.args }}
